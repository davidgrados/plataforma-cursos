# ============================================================
#  Plataforma multi-curso con laboratorio Linux interactivo
#  Cloudflare Pages (next-on-pages, single-worker) + D1 + R2
# ============================================================
name = "plataforma-cursos-linux"
compatibility_date = "2024-06-20"
compatibility_flags = ["nodejs_compat"]

# Salida del build de Next.js (generado por @cloudflare/next-on-pages)
pages_build_output_dir = ".vercel/output/static"

# ------------------------------------------------------------
# Base de datos D1 (SQLite)
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "plataforma-cursos-db"
database_id = "ad91bb43-1566-43bc-b6d0-229abaeff62a"

# ------------------------------------------------------------
# Almacenamiento R2 (imágenes de cursos)
# Nota: descomentado SOLO cuando R2 esté habilitado en el dashboard
# y se haya creado el bucket con: wrangler r2 bucket create plataforma-cursos-images
# ------------------------------------------------------------
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "plataforma-cursos-images"

# ------------------------------------------------------------
# Variables de entorno accesibles en el worker (env.VAR)
# ------------------------------------------------------------
[vars]
# URL pública del bucket R2 (formato: https://pub-<hash>.r2.dev)
PUBLIC_R2_URL = "https://pub-REPLACE_WITH_HASH.r2.dev"
