<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Varios cursos disponibles">
  <defs>
    <linearGradient id="vcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.55" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="vcGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vcShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#vcBg)"/>
  <circle cx="400" cy="230" r="200" fill="url(#vcGlow)"/>

  <!-- tarjeta apilada detrás -->
  <rect x="257" y="112" width="330" height="230" rx="22" fill="#e0f2fe"/>

  <!-- 4 mini cursos -->
  <g fill="#ffffff" stroke="#bae6fd" stroke-width="4">
    <rect x="235" y="122" width="155" height="98" rx="18"/>
    <rect x="410" y="122" width="155" height="98" rx="18"/>
    <rect x="235" y="238" width="155" height="98" rx="18"/>
    <rect x="410" y="238" width="155" height="98" rx="18"/>
  </g>

  <!-- 1: terminal -->
  <rect x="290" y="152" width="46" height="34" rx="7" fill="#1e293b"/>
  <path d="M 299 162 L 306 169 L 299 176" fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="313" y="173" width="13" height="4" rx="2" fill="#7dd3fc"/>

  <!-- 2: inglés -->
  <text x="487" y="188" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#0ea5e9" text-anchor="middle">ABC</text>

  <!-- 3: red neuronal -->
  <g stroke="#c7d2fe" stroke-width="3">
    <path d="M 283 268 L 312 288"/><path d="M 283 308 L 312 288"/><path d="M 312 288 L 341 268"/><path d="M 312 288 L 341 308"/>
  </g>
  <g fill="#ffffff" stroke="#818cf8" stroke-width="4">
    <circle cx="283" cy="268" r="9"/>
    <circle cx="283" cy="308" r="9"/>
    <circle cx="341" cy="268" r="9"/>
    <circle cx="341" cy="308" r="9"/>
    <circle cx="312" cy="288" r="10"/>
  </g>

  <!-- 4: escudo -->
  <path d="M 487 262 L 519 274 V 296 C 519 318 504 332 487 339 C 470 332 455 318 455 296 V 274 Z"
        fill="url(#vcShield)"/>
  <path d="M 477 300 L 485 308 L 499 292" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
