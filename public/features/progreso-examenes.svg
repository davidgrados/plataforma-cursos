<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Progreso guardado y exámenes con validación">
  <defs>
    <linearGradient id="pxBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.55" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pxFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="pxGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pxOk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#pxBg)"/>
  <circle cx="150" cy="140" r="150" fill="url(#pxGlow)"/>
  <circle cx="680" cy="330" r="140" fill="url(#pxGlow)"/>

  <!-- barra de progreso -->
  <rect x="180" y="148" width="440" height="28" rx="14" fill="#e0f2fe"/>
  <rect x="180" y="148" width="316" height="28" rx="14" fill="url(#pxFill)"/>
  <circle cx="496" cy="162" r="17" fill="#ffffff" stroke="#6366f1" stroke-width="5"/>
  <text x="180" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#0284c7">Tu progreso</text>
  <text x="620" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#6366f1" text-anchor="end">72%</text>

  <!-- lista de lecciones -->
  <g>
    <circle cx="212" cy="216" r="16" fill="url(#pxOk)"/>
    <path d="M 204 216 L 210 222 L 221 210" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="244" y="209" width="250" height="15" rx="8" fill="#bae6fd"/>

    <circle cx="212" cy="272" r="16" fill="url(#pxOk)"/>
    <path d="M 204 272 L 210 278 L 221 266" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="244" y="265" width="320" height="15" rx="8" fill="#bae6fd"/>

    <circle cx="212" cy="328" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="5"/>
    <rect x="244" y="321" width="180" height="15" rx="8" fill="#e2e8f0"/>
  </g>

  <!-- examen aprobado -->
  <g>
    <circle cx="620" cy="292" r="47" fill="url(#pxOk)"/>
    <path d="M 600 292 L 614 306 L 641 277" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
