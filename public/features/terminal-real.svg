<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Terminal real simulado en el navegador">
  <defs>
    <linearGradient id="trBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.55" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="trGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trOk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#trBg)"/>
  <circle cx="140" cy="130" r="150" fill="url(#trGlow)"/>
  <circle cx="680" cy="330" r="150" fill="url(#trGlow)"/>

  <!-- ventana de terminal -->
  <rect x="110" y="105" width="470" height="225" rx="20" fill="#ffffff" stroke="#bae6fd" stroke-width="5"/>
  <circle cx="146" cy="139" r="8" fill="#7dd3fc"/>
  <circle cx="172" cy="139" r="8" fill="#c7d2fe"/>
  <circle cx="198" cy="139" r="8" fill="#bae6fd"/>
  <rect x="110" y="163" width="470" height="4" fill="#e0f2fe"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <text x="142" y="212" fill="#0284c7">$ ls</text>
    <text x="300" y="212" fill="#94a3b8">documentos  tareas</text>
    <text x="142" y="256" fill="#0284c7">$ mkdir practica</text>
    <text x="142" y="300" fill="#0284c7">$ echo "ok"</text>
  </g>
  <rect x="176" y="282" width="14" height="24" rx="3" fill="#0ea5e9"/>

  <!-- validación superada -->
  <circle cx="600" cy="300" r="44" fill="url(#trOk)"/>
  <path d="M 578 300 L 594 316 L 624 284" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#bae6fd">
    <circle cx="646" cy="140" r="8"/>
    <circle cx="686" cy="176" r="5"/>
  </g>
</svg>
