<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Portada del curso Marketing Digital y Redes Sociales">
  <defs>
    <linearGradient id="mkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.55" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="mkCone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mkBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="mkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#mkBg)"/>
  <circle cx="120" cy="90" r="140" fill="url(#mkGlow)"/>
  <circle cx="700" cy="380" r="140" fill="url(#mkGlow)"/>

  <!-- megáfono -->
  <path d="M 200 188 L 322 138 V 300 L 200 250 Z" fill="url(#mkCone)"/>
  <rect x="322" y="138" width="44" height="162" rx="14" fill="#0369a1"/>
  <rect x="232" y="248" width="38" height="76" rx="18" fill="#0369a1"/>

  <!-- ondas de difusión -->
  <g fill="none" stroke="#38bdf8" stroke-linecap="round">
    <path d="M 396 176 A 62 62 0 0 1 396 262" stroke-width="9" opacity="0.95"/>
    <path d="M 420 148 A 102 102 0 0 1 420 290" stroke-width="9" opacity="0.65"/>
    <path d="M 444 120 A 142 142 0 0 1 444 318" stroke-width="9" opacity="0.4"/>
  </g>

  <!-- crecimiento -->
  <g>
    <rect x="540" y="252" width="42" height="72" rx="12" fill="#bae6fd"/>
    <rect x="600" y="212" width="42" height="112" rx="12" fill="#7dd3fc"/>
    <rect x="660" y="162" width="42" height="162" rx="12" fill="url(#mkBar)"/>
    <path d="M 552 226 L 618 186 L 678 136" fill="none" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="678" cy="136" r="11" fill="#0ea5e9"/>
  </g>

  <g fill="#c7d2fe">
    <circle cx="150" cy="120" r="9"/>
    <circle cx="520" cy="100" r="7"/>
  </g>
</svg>
